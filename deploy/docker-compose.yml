version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkora-postgres
    restart: always
    environment:
      POSTGRES_USER: linkora
      POSTGRES_PASSWORD: linkora_secret
      POSTGRES_DB: linkora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkora -d linkora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: linkora-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: linkora-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://linkora:linkora_secret@postgres:5432/linkora_db
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: linkora-shares
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
