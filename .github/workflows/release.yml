name: LINKORA Release Packaging & Artifact Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Rename Artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk LINKORA-android-arm64.apk

      - name: Calculate Checksum
        run: sha256sum LINKORA-android-arm64.apk > LINKORA-android-arm64.apk.sha256

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            LINKORA-android-arm64.apk
            LINKORA-android-arm64.apk.sha256

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/linkora_setup.iss

      - name: Calculate Windows Checksum
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 build/installer/LINKORA-windows-x64-setup.exe | Select-Object -ExpandProperty Hash > build/installer/LINKORA-windows-x64-setup.exe.sha256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/installer/LINKORA-windows-x64-setup.exe
            build/installer/LINKORA-windows-x64-setup.exe.sha256
