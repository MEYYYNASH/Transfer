name: linkora
description: "LINKORA — Secure Cross-Platform File Sharing & Device Transfer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # File Handling & Networking
  file_picker: ^8.0.5
  dio: ^5.4.3+1
  http: ^1.2.1
  crypto: ^3.0.3
  network_info_plus: ^5.0.3
  open_filex: ^4.4.0

  # QR Code & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Charts & UI
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
